name: Daymo Auth Preview Validation
on:
  pull_request:
    branches:
      - main
    paths:
      - app/**
      - src/**
      - package.json
      - package-lock.json
      - next.config.mjs
      - vercel.json
      - .github/workflows/daymo-auth-preview-validation.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Next.js production build
        run: npm run build
        env:
          NEXT_PUBLIC_DAYMO_AUTH_TEST_MODE: 'true'
          NEXT_PUBLIC_SUPABASE_URL: 'https://qglwymsqskagoobpvcna.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_dummy_compile_only'
