name: Update Daymo auth lockfile
on:
  push:
    branches:
      - feat/daymo-auth-cloud-foundation
    paths:
      - package.json
      - .github/workflows/daymo-auth-lockfile.yml
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/daymo-auth-cloud-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Generate matching package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if updated
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(auth): synchronize package lockfile'
            git push origin HEAD:feat/daymo-auth-cloud-foundation
          fi
